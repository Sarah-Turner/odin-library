<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
</head>
<body>
    <h1>Library</h1>
    <button command="show-modal" commandfor="form-dialog">New Book</button>
    <dialog id="form-dialog">
        <button class="dialog-btn-close" command="close" commandfor="form-dialog">
            <svg class="close-svg" width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>window-close</title><path d="M13.46,12L19,17.54V19H17.54L12,13.46L6.46,19H5V17.54L10.54,12L5,6.46V5H6.46L12,10.54L17.54,5H19V6.46L13.46,12Z"/></svg>
        </button>
    </dialog>
    <table>
        <caption>Books</caption>
        <thead>
            <tr>
                <th scope="col">Title</th>
                <th scope="col">Author</th>
                <th scope="col">Pages</th>
                <th scope="col">Read</th>
                <th scope="col" colspan="2">Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</body>
</html>
